@keyframes d4{0%,59%{opacity:1}60.5%,93%{opacity:.42}97%,100%{opacity:1}}
.d4{animation-name:d4}
@keyframes p5{0%{opacity:0;transform:translate(318px,214px)} 64%{opacity:0;transform:translate(318px,214px)} 65%{opacity:1;transform:translate(322px,214px)} 69%{opacity:1;transform:translate(400px,214px)} 73%{opacity:1;transform:translate(494px,322px)} 74%{opacity:0;transform:translate(508px,322px)} 100%{opacity:0;transform:translate(508px,322px)}}
