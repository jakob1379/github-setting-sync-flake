<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d">
<title id="t">github-settings-sync applying one settings file across an organization</title>
<desc id="d">A settings.json with repository, collaborators, branch_protection and files sections is sent through a name-pattern filter to each repository in my-org in turn. The four repositories whose names match "api" receive all four sections and are marked updated; web-app and legacy-cron do not match and are skipped. The run ends with a summary: 6 total, 4 processed, 2 skipped.</desc>
<style>
:root{--bg:#F2F5FA;--panel:#FFFFFF;--ink:#1B2540;--muted:#66728C;--line:#CCD4E4;--band:#E3EBFA;
--k1:#5277C3;--k2:#1497AE;--k3:#D6952A;--k4:#B9529A;--ok:#2E8B57;--skip:#8E98AD}
@media (prefers-color-scheme:dark){:root{--bg:#0F1628;--panel:#172140;--ink:#E2E8F5;--muted:#95A2BF;--line:#2E3C61;--band:#22305A;
--k1:#86A6EC;--k2:#45C4D9;--k3:#F0B653;--k4:#E486C6;--ok:#62CC8C;--skip:#66728F}}
.bg{fill:var(--bg)}
.card{fill:var(--panel);stroke:var(--line);stroke-width:1}
.rule{stroke:var(--line);stroke-width:1}
.sans{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.cmd{font-size:14px;fill:var(--ink)}
.prompt{fill:var(--muted)}
.flag{fill:var(--k1)}
.title{font-size:13px;font-weight:600;fill:var(--ink)}
.meta{font-size:12px;fill:var(--muted)}
.code{font-size:13.5px}
.key{fill:var(--ink)}
.punc{fill:var(--muted)}
.repo{font-size:13.5px;fill:var(--ink)}
.k1{fill:var(--k1)}.k2{fill:var(--k2)}.k3{fill:var(--k3)}.k4{fill:var(--k4)}
.slot{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:3 2.5}
.fan{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.wire{stroke:var(--line);stroke-width:1.5}
.gate{fill:var(--panel);stroke:var(--k1);stroke-width:1.5}
.gtext{font-size:12.5px;fill:var(--ink)}
.tick{fill:none;stroke:var(--ok);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cross{fill:none;stroke:var(--skip);stroke-width:1.8;stroke-linecap:round}
.ok{font-size:12.5px;fill:var(--ok)}
.skip{font-size:12.5px;fill:var(--skip)}
.band{fill:var(--band);opacity:0}
.dim{opacity:.42}
.sumtext{font-size:13px;fill:var(--ink)}
.pk{opacity:0}
.pk,.band,.on,.dim,.sum{animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-fill-mode:both}
.sum{animation-name:sum}
