@keyframes o5{0%,73%{opacity:0}74.5%,93%{opacity:1}97%,100%{opacity:0}}
.o5{animation-name:o5}
@media (prefers-reduced-motion:reduce){.pk,.band,.on,.dim,.sum{animation:none}.pk{display:none}}
</style>
