@keyframes p0{0%{opacity:0;transform:translate(318px,214px)} 4%{opacity:0;transform:translate(318px,214px)} 5%{opacity:1;transform:translate(322px,214px)} 9%{opacity:1;transform:translate(400px,214px)} 13%{opacity:1;transform:translate(494px,142px)} 14%{opacity:0;transform:translate(508px,142px)} 100%{opacity:0;transform:translate(508px,142px)}}
