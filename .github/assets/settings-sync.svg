@keyframes p4{0%{opacity:0;transform:translate(318px,214px)} 52%{opacity:0;transform:translate(318px,214px)} 53%{opacity:1;transform:translate(322px,214px)} 57%{opacity:1;transform:translate(400px,214px)} 58%{opacity:1;transform:translate(400px,214px)} 60%{opacity:0;transform:translate(400px,224px)} 100%{opacity:0;transform:translate(400px,224px)}}
.p4{animation-name:p4}
